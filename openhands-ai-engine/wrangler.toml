name = "openhands-ai-engine"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[placement]
mode = "smart"

[env.production]
name = "openhands-ai-engine"
routes = [
    { pattern = "exec.lunaos.ai/*", zone_name = "lunaos.ai" }
]

[env.production.vars]
ENVIRONMENT = "production"
OPENCLAW_URL = "https://api.lunaos.ai"
